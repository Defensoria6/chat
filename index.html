<!--
=====================================================================
 DEFENSORÍA OFICIAL CIVIL 6 – CHAT  (un solo archivo · Firebase Auth + Firestore)
 ACCESO DE CLIENTES SIN SMS: se usa autenticación anónima y se busca el
 número ingresado en la colección contacts. Si existe, se entra al chat.

 PASOS PARA PONERLO EN LÍNEA
 1. Firebase Console → Configuración del proyecto → Tus apps → App web.
    Copia el objeto firebaseConfig y pégalo en FIREBASE_CONFIG (en el <script>).
 2. Authentication → Método de acceso: activa "Correo/contraseña" y "Anónimo".
    Configuración → Dominios autorizados: agrega el dominio donde publiques.
 3. Firestore Database → crear base de datos → pestaña Reglas → pega las reglas de abajo.
 4. Personal: crea cada usuario en Authentication (correo y contraseña) y luego,
    en Firestore, un documento  staff/<UID del usuario>  con el campo
    role (string):  "admin"  o  "empleado".
      admin    → ve todo, crea, EDITA y BORRA contactos (y sus mensajes).
      empleado → ve y crea contactos y conversa; no edita ni borra.
    Sin ese documento, la cuenta no tiene acceso de personal.
 5. Clientes: el personal los registra (botón ➕) con el teléfono en dígitos y
    código de país (ej. 5493764123456) y el empleado asignado (campo "employee",
    visible solo para el personal). El cliente entra escribiendo ese número.
    No se envía SMS: el acceso se concede si el número existe en contacts.
    ⚠️ Esto implica que cualquiera que conozca un número registrado puede
    entrar a ese chat. Es el comportamiento pedido (sin verificación por SMS).
 6. Publica este archivo en un hosting HTTPS (por ejemplo Firebase Hosting).
 7. Horario del cliente: solo puede ingresar y escribir de lunes a viernes, de 7 a 11 h
    (hora de Argentina), salvo feriados. Los feriados nacionales y el provincial de Misiones
    vienen cargados en el código (HOL_YEARLY / HOL_DATES). El administrador agrega otros con el
    botón de calendario de la barra lateral (se guardan en la colección holidays). Para que
    funcione, agrega al final las reglas de /holidays que figuran abajo y publícalas.
    El personal (modo Defensoría) está siempre disponible y puede escribir a cualquier hora.
    El cliente solo RECIBE mensajes de la Defensoría dentro del horario habilitado: los que se
    envían fuera de horario quedan retenidos y los ve al ingresar en el próximo horario habilitado.

 REGLAS DE FIRESTORE
 rules_version = '2';
 service cloud.firestore {
   match /databases/{database}/documents {
     function signedIn() { return request.auth != null; }
     function isStaff() { return signedIn() &&
       exists(/databases/$(database)/documents/staff/$(request.auth.uid)); }
     function isAdmin() { return isStaff() &&
       get(/databases/$(database)/documents/staff/$(request.auth.uid)).data.role == 'admin'; }
     function validContact() { return
       request.resource.data.keys().hasOnly(['name','phone','createdAt','employee'])
       && request.resource.data.name is string
       && request.resource.data.name.size() > 0
       && request.resource.data.name.size() <= 80
       && (!('employee' in request.resource.data.keys())
           || (request.resource.data.employee is string
               && request.resource.data.employee.size() <= 80)); }
     match /staff/{uid} {
       allow read: if signedIn() && request.auth.uid == uid;
       allow write: if false;
     }
     match /contacts/{id} {
       // El cliente (anónimo) puede leer para comprobar que su número existe.
       allow read: if isStaff() || signedIn();
       allow create: if isStaff() && validContact();
       allow update: if isAdmin() && validContact();
       allow delete: if isAdmin();
     }
     match /messages/{id} {
       // El cliente (anónimo) puede leer y escribir mensajes del contacto.
       allow read: if isStaff() || signedIn();
       allow create: if request.resource.data.keys().hasOnly(['cid','from','text','ts'])
         && request.resource.data.text is string
         && request.resource.data.text.size() > 0
         && request.resource.data.text.size() <= 2000
         && request.resource.data.ts is int
         && ((isStaff() && request.resource.data.from == 'staff')
             || (signedIn() && request.resource.data.from == 'client'))
         && exists(/databases/$(database)/documents/contacts/$(request.resource.data.cid));
       allow update: if false;
       allow delete: if isAdmin();
     }
     match /holidays/{id} {
       // Feriados agregados por el administrador. Lectura pública: el cliente todavía no
       // inició sesión cuando se comprueba el horario. Solo el administrador escribe.
       allow read: if true;
       allow create, update: if isAdmin()
         && request.resource.data.keys().hasOnly(['date','name','yearly','createdAt'])
         && request.resource.data.date is string
         && request.resource.data.date.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
         && id == request.resource.data.date
         && request.resource.data.name is string
         && request.resource.data.name.size() <= 80
         && request.resource.data.yearly is bool;
       allow delete: if isAdmin();
     }
   }
 }
=====================================================================
-->

<script type="module">
/* ============ CONFIGURACIÓN (completa esto) ============
   Pega aquí tu firebaseConfig (Firebase Console → Configuración del proyecto → Tus apps). */
const FIREBASE_CONFIG = {apiKey: "AIzaSyA6NpWwPJSD5bn-_LXo3tGVXzYM4vSPALw",
  authDomain: "chat-def6.firebaseapp.com",
  projectId: "chat-def6",
  storageBucket: "chat-def6.firebasestorage.app",
  messagingSenderId: "464104957132",
  appId: "1:464104957132:web:c62bc672dd125da5dace69"};
// Nombres de las colecciones de Firestore (si los cambias, cámbialos también en las reglas)
const COL = { staff: 'staff', contacts: 'contacts', messages: 'messages', holidays: 'holidays' };
const CONFIGURED = !/PEGA_AQUI/.test(JSON.stringify(FIREBASE_CONFIG));

/* Mensajes automáticos del chat del cliente (no se guardan en Firestore: solo se muestran).
   welcomeHtml lleva la parte informativa dentro de <span class="note"> (texto normal azul oscuro)
   y la parte de advertencia dentro de <span class="warn"> (texto normal rojo), separadas por un renglón. */
const AUTO = {
  welcome: 'Bienvenido a nuestro chat. En breve un agente judicial de nuestra Defensoría atenderá tu consulta.'
    + '\n\nTen en cuenta esto:'

  welcomeHtml: 'Bienvenido a nuestro chat. En breve un agente judicial de nuestra Defensoría atenderá tu consulta.'
    + '<br><br>Ten en cuenta esto:'
    + '<span class="note">Expediente de tu causa judicial'
    + '<br>Tu nombre y apellido, DNI'
    + '<br>Con estos datos podremos brindarte la información de tu causa.</span>'
    + '<span class="warn">Este chat permite consultas, pero no se reciben ni envían documentación, tampoco se notifica de resoluciones del Juzgado.'
    + '<br>No recibimos audios, videos, ni llamadas por este medio.'
    + '<br>Para notificarte alguna resolución del Juzgado en tu expediente debes concurrir a nuestra defensoría, de lunes a viernes de 7 a 11 hs.'
    + '<br>Sábados, Domingos y Feriados nuestra oficina no atiende.</span>',
  delay: 'Disculpe la demora, nuestros agentes se encuentran ocupados. En breve te responderemos.'
};
const DELAY_MS = 5 * 60 * 1000; // 5 minutos

   El cliente solo puede ingresar y escribir de lunes a viernes, de 7:00 a 10:59 (hora de Argentina),
   salvo feriados. Fuera de ese horario se muestra un aviso rojo. El personal no tiene restricción.
   Aviso: la hora sale del reloj del dispositivo (convertida a hora de Argentina). */
const TZ = 'America/Argentina/Buenos_Aires', OPEN_H = 7, CLOSE_H = 11;
const CLOSED_MSG = 'Disculpa, intenta comunicarte el próximo día hábil';

/* Feriados que se repiten todos los años (MM-DD): nacionales inamovibles, Ley 27.399. */
const HOL_YEARLY = {
  '01-01': 'Año Nuevo',

};
/* Feriados de fecha puntual (AAAA-MM-DD): los que cambian cada año (Carnaval, Semana Santa,
   trasladables, días puente) y el asueto provincial de Misiones (Natalicio de Andresito, 30/11).
   Los puentes de 2027 aún no fueron decretados y el asueto de Misiones de 2027 depende de un
   decreto provincial: agrégalos desde el botón de calendario (administrador) o en esta lista. */
const HOL_DATES = {
  // 2026
  '2026-02-16': 'Carnaval', '2026-02-17': 'Carnaval',
  '2026-03-23': 'Día no laborable con fines turísticos',
  '2026-04-03': 'Viernes Santo',
  '2026-06-15': 'Paso a la Inmortalidad del General Güemes (trasladado)',
  '2026-07-10': 'Día no laborable con fines turísticos',
  '2026-08-17': 'Paso a la Inmortalidad del General San Martín',
  '2026-10-12': 'Día del Respeto a la Diversidad Cultural',
  '2026-11-23': 'Día de la Soberanía Nacional (trasladado)',
  '2026-12-07': 'Día no laborable con fines turísticos',
  // 2027
  '2027-02-08': 'Carnaval', '2027-02-09': 'Carnaval',

/* Fecha, día de la semana y hora actuales en Argentina. */
function arParts(t) {
  const o = {};
  new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit' })
    .formatToParts(t || new Date()).forEach(p => { o[p.type] = p.value; });
  return { date: o.year + '-' + o.month + '-' + o.day, md: o.month + '-' + o.day, h: +o.hour % 24,
           wd: new Date(Date.UTC(+o.year, +o.month - 1, +o.day)).getUTCDay() };
}
const isHoliday = p => !!(HOL_DATES[p.date] || HOL_YEARLY[p.md]
  || extraHol.some(h => h.date === p.date || (h.yearly && String(h.date).slice(5) === p.md)));
/* true solo en día hábil (lunes a viernes, no feriado) y de 7:00 a 10:59. */
const clientOpen = t => { const p = arParts(t); return p.wd >= 1 && p.wd <= 5 && !isHoliday(p) && p.h >= OPEN_H && p.h < CLOSE_H; };

}

const V = '10.14.1', G = `https://www.gstatic.com/firebasejs/${V}/`;
async function createFirebase(cfg) {
  const [A, U, F] = await Promise.all([
    import(G + 'firebase-app.js'), import(G + 'firebase-auth.js'), import(G + 'firebase-firestore.js')]);
  const app = A.initializeApp(cfg), auth = U.getAuth(app), db = F.getFirestore(app);
  auth.languageCode = 'es';
  const digits = s => String(s).replace(/\D/g, '');
  async function roleOf(u) {
    if (u.isAnonymous) return { role: 'anon' };
    if (u.phoneNumber) return { role: 'client', phone: digits(u.phoneNumber) };
    const d = await F.getDoc(F.doc(db, COL.staff, u.uid)).catch(() => null);
    return d && d.exists() ? { role: 'staff', admin: d.data().role === 'admin' } : null;
  }
  return {
    mode: 'firebase',
    session: () => new Promise(res => {
      const off = U.onAuthStateChanged(auth, async u => { off(); res(u ? await roleOf(u) : null); });
    }),
    async staffLogin(email, pw) {
      const c = await U.signInWithEmailAndPassword(auth, email, pw);
      const r = await roleOf(c.user);
      if (!r) { await U.signOut(auth); throw new Error('Esta cuenta no tiene permiso de personal.'); }
      return r;
    },
    // Acceso de cliente SIN SMS: autenticación anónima.
    async anonLogin() {
      if (auth.currentUser) {
        if (auth.currentUser.isAnonymous) return { role: 'anon' };
        await U.signOut(auth);
      }
      await U.signInAnonymously(auth);
      return { role: 'anon' };
    },
    signOut: () => U.signOut(auth),
    getContact: async p => { const d = await F.getDoc(F.doc(db, COL.contacts, p)); return d.exists() ? d.data() : null; },
    setContact: (p, d) => F.setDoc(F.doc(db, COL.contacts, p), d),
    updateContact: (p, d) => F.updateDoc(F.doc(db, COL.contacts, p), d),
    async deleteContact(p) {
      const s = await F.getDocs(F.query(F.collection(db, COL.messages), F.where('cid', '==', p)));
      for (let i = 0; i < s.docs.length; i += 400) { const b = F.writeBatch(db); s.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      await F.deleteDoc(F.doc(db, COL.contacts, p));
    },
    watchContacts: (cb, er) => F.onSnapshot(F.collection(db, COL.contacts),
      s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), er),
    watchMsgs: (cid, cb, er) => F.onSnapshot(
      cid ? F.query(F.collection(db, COL.messages), F.where('cid', '==', cid)) : F.collection(db, COL.messages),
      s => cb(s.docs.map(d => d.data())), er),
    addMsg: m => F.addDoc(F.collection(db, COL.messages), m),
    // Feriados agregados por el administrador.
    listHolidays: async () => (await F.getDocs(F.collection(db, COL.holidays))).docs.map(d => ({ id: d.id, ...d.data() })),
    setHoliday: (id, d) => F.setDoc(F.doc(db, COL.holidays, id), d),
    deleteHoliday: id => F.deleteDoc(F.doc(db, COL.holidays, id))
  };
}

/* Campo de teléfono con prefijo fijo +54 9 (Argentina, móvil): se muestra solo y no se puede borrar ni duplicar. */
function arPhone(inp) {
  const P = '+54 9 ';
  const fix = () => {
    let d = clean(inp.value);
    if (d.startsWith('549')) d = d.slice(3);
    if (d.length > 10) {
      if (d.startsWith('549')) d = d.slice(3);
      else if (d.startsWith('54')) d = d.slice(2);
      else if (d.startsWith('9')) d = d.slice(1);
    }
    d = d.replace(/^0+/, '').slice(0, 10);
    const v = P + d;
    if (inp.value !== v) inp.value = v;
  };
  inp.addEventListener('input', fix);
  const end = () => { if (inp.selectionStart === inp.selectionEnd && inp.selectionStart < P.length) inp.setSelectionRange(inp.value.length, inp.value.length); };
  inp.addEventListener('focus', () => { end(); setTimeout(end); });
  inp.addEventListener('click', end);
  fix();
}

/* Busca el contacto probando el número en todos los formatos posibles
   (con/sin "+", con/sin 54, con/sin el 9 de móvil). */
async function findContact(p) {
  const d = String(p).replace(/\D/g, '');
  const nat = d.startsWith('549') ? d.slice(3) : d.startsWith('54') ? d.slice(2) : d;
  const cands = [d, '+' + d, nat, '+54' + nat, '549' + nat, '+549' + nat, '54' + nat];
  const seen = new Set();
  for (const id of cands) {
    if (!id || seen.has(id)) continue;
    seen.add(id);
    const c = await S.getContact(id).catch(() => null);
    if (c) return { id, c };
  }
  return null;
}

/* Aviso automático si pasan 5 minutos sin respuesta del personal. */
function scheduleDelay() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }

  autoTimer = setTimeout(() => {

    if (last('staff') > last('client')) return;              // ya respondió el personal
    if (autoMsgs.some(a => a.delay)) return;

  m.innerHTML = `<div class="card"><h2>Nuevo contacto</h2><input class="field" id="cn" placeholder="Nombre y apellido"><input class="field" id="cp" type="tel" inputmode="tel" value="+54 9 " autocomplete="off"><p class="sub">El prefijo +54 9 se agrega solo. Escribe la característica y el número, sin 0 ni 15 (ej.: 376 4123456).</p><input class="field" id="cw" maxlength="80" placeholder="Empleado asignado (obligatorio)" autocomplete="off"><p class="err" id="ce"></p><div class="acts"><button class="btn alt" id="cc">Cancelar</button><button class="btn" id="cs">Guardar</button></div></div>`;
  document.body.appendChild(m); $('#cn').focus(); $('#cc').onclick = () => m.remove();
  arPhone($('#cp'));
  $('#cs').onclick = async () => {
    const n = $('#cn').value.trim(), p = clean($('#cp').value), emp = $('#cw').value.trim().slice(0, 80);
    if (!n || p.length !== 13) return $('#ce').textContent = 'Ingresa el nombre y el número completo: característica + número (10 dígitos).';
    if (!emp) return $('#ce').textContent = 'Indica el empleado asignado a este cliente.';
    if (contacts[p]) return $('#ce').textContent = 'Ese número ya está registrado.';
    try { await S.setContact(p, { name: n.slice(0, 80), phone: p, employee: emp, createdAt: Date.now() }); m.remove(); toast('Contacto registrado'); }
    catch (e) { $('#ce').textContent = errMsg(e); }
  };
}

/* ---------- Administrador: editar y borrar ---------- */
function closeChat() {
  active = null; $('#app').classList.remove('open'); $('#main').className = 'main';
  $('#main').innerHTML = `<div class="ph"><div class="logo">${WA}</div><p>Selecciona un chat para ver la conversación</p></div>`; renderSide();
}
function editContact(id) {
  const c = contacts[id]; if (!admin || !c) return;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><h2>Editar contacto</h2><input class="field" id="cn" maxlength="80" value="${esc(c.name)}"><input class="field" id="cw" maxlength="80" placeholder="Empleado asignado" value="${esc(c.employee || '')}" autocomplete="off"><p class="sub">Teléfono: ${showPhone(id)}. No se puede cambiar; para otro número, crea un contacto nuevo.</p><p class="err" id="ce"></p><div class="acts"><button class="btn alt" id="cc">Cancelar</button><button class="btn" id="cs">Guardar</button></div></div>`;
  document.body.appendChild(m); $('#cn').focus(); $('#cc').onclick = () => m.remove();
  $('#cs').onclick = async () => {
    const n = $('#cn').value.trim().slice(0, 80); if (!n) return $('#ce').textContent = 'Ingresa un nombre.';
    // En contactos antiguos (sin empleado) el campo puede quedar vacío; en los nuevos se exige al crearlos.
    const emp = $('#cw').value.trim().slice(0, 80);
    try { await S.updateContact(id, { name: n, employee: emp }); contacts[id].name = n; contacts[id].employee = emp; m.remove(); openChat(id); toast('Contacto actualizado'); }
    catch (e) { $('#ce').textContent = errMsg(e); }
  };
}
async function delContact(id) {
  const c = contacts[id]; if (!admin || !c || !confirm('¿Borrar a ' + c.name + ' y toda su conversación? No se puede deshacer.')) return;
  try { await S.deleteContact(id); closeChat(); toast('Contacto borrado'); }
  catch (e) { toast(errMsg(e)); }
}

/* ---------- Administrador: feriados ---------- */
const fmtD = d => String(d).split('-').reverse().join('/');
async function holidaysModal() {
  if (!admin) return;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><h2>Feriados</h2>
  <p class="sub">Los feriados nacionales y el provincial de Misiones ya vienen cargados. Agrega aquí los que falten (días puente, asuetos, cambios por decreto). En esas fechas los clientes no pueden ingresar ni escribir.</p>
  <div class="hlist" id="hl"></div>
  <input class="field" id="hd" type="date" aria-label="Fecha del feriado">
  <input class="field" id="hn" maxlength="80" placeholder="Descripción (ej.: Día puente)" autocomplete="off">
  <label class="chk"><input type="checkbox" id="hy"> Se repite todos los años</label>
  <p class="err" id="he"></p>
  <div class="acts"><button class="btn alt" id="hc">Cerrar</button><button class="btn" id="ha">Agregar</button></div></div>`;
  document.body.appendChild(m);
  const draw = () => {
    const el = $('#hl'); if (!el) return;
    const l = extraHol.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    el.innerHTML = l.map(h => `<div class="hrow"><span><b>${esc(fmtD(h.date))}</b> ${esc(h.name)}${h.yearly ? ' <small>(todos los años)</small>' : ''}</span><button class="ib dng" data-id="${esc(h.id)}" title="Quitar" aria-label="Quitar feriado">${I.del}</button></div>`).join('')
      || '<div class="empty" style="padding:10px">Todavía no agregaste feriados propios.</div>';
  };
  draw(); loadHolidays(true).then(draw);
  $('#hc').onclick = () => m.remove();
  $('#hl').onclick = async e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    try { await S.deleteHoliday(b.dataset.id); extraHol = extraHol.filter(h => h.id !== b.dataset.id); draw(); toast('Feriado quitado'); }
    catch (er) { $('#he').textContent = errMsg(er); }
  };
  $('#ha').onclick = async () => {
    const date = $('#hd').value, name = $('#hn').value.trim().slice(0, 80), yearly = $('#hy').checked, er = $('#he');
    er.textContent = '';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return er.textContent = 'Elige la fecha del feriado.';
    if (!name) return er.textContent = 'Escribe una descripción.';
    try {
      const d = { date, name, yearly, createdAt: Date.now() };
      await S.setHoliday(date, d);
      extraHol = extraHol.filter(h => h.id !== date).concat([{ id: date, ...d }]);
      $('#hd').value = ''; $('#hn').value = ''; $('#hy').checked = false;
      draw(); toast('Feriado agregado');
    } catch (e) { er.textContent = errMsg(e); }
  };
}

/* ---------- Chat común ---------- */
const composer = () => `<div class="comp"><input id="inp" placeholder="Escribe un mensaje" autocomplete="off" maxlength="2000"><button class="send" id="send" title="Enviar" aria-label="Enviar">${I.send}</button></div>`;
function wireComposer() { $('#send').onclick = send; $('#inp').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }; }
const curCid = () => me === 'staff' ? active : phone;
function renderMsgs() {
  const el = $('#msgs'), cid = curCid(); if (!el || !cid) return;
  // Se combinan los mensajes reales con los mensajes automáticos del cliente.
  let list = msgs.filter(m => m.cid === cid).concat(autoMsgs.filter(a => a.cid === cid)).sort((a, b) => a.ts - b.ts);
  // Cliente: los mensajes de la Defensoría solo se reciben en día y horario habilitados. Los que llegan fuera
  // de horario se retienen y aparecen cuando el horario se abre; los ya recibidos no se ocultan.
  if (me === 'client') {
    const open = clientOpen();
    list = list.filter(m => {
      if (m.from !== 'staff' || m.auto || m.delay) return true;
      const k = m.ts + '|' + m.text;
      if (open) { seen.add(k); return true; }
      return seen.has(k);
    });
  }
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80, mine = me === 'staff' ? 'staff' : 'client';
  let h = '', last = '';
  list.forEach(m => { const d = dayLbl(m.ts); if (d !== last) { h += `<div class="day"><span>${d}</span></div>`; last = d; }
    const o = m.from === mine;
    // Los mensajes de la Defensoría van en negrita azul; los del cliente, en texto normal.
    const who = m.from === 'staff' ? 'staffmsg' : 'clientmsg';
    // La bienvenida usa su propio HTML: parte informativa azul oscuro y parte de advertencia roja.
    const body = m.welcome ? AUTO.welcomeHtml : esc(m.text);
    h += `<div class="b ${o ? 'out' : 'in'} ${who}">${body}<span class="meta">${tm(m.ts)}${o ? TK : ''}</span></div>`; });
  el.innerHTML = h || '<div class="day"><span>Aún no hay mensajes</span></div>';
  if (near || el._c !== cid) { el.scrollTop = el.scrollHeight; el._c = cid; }
  if (me === 'staff' && list.length) { const lr = ls.get('lr') || {}, mx = list[list.length - 1].ts; if ((lr[cid] || 0) < mx) { lr[cid] = mx; ls.set('lr', lr); renderSide(); } }
}
async function send() {
  const i = $('#inp'), t = i.value.trim(), cid = curCid(); if (!t || !cid) return;
  // El cliente solo puede escribir en día hábil y de 7 a 11 h (hora de Argentina). El personal no tiene restricción.
  if (me === 'client') { loadHolidays(); if (!clientOpen()) { showClosed(); return; } }
  i.value = '';
  try {
    await S.addMsg({ cid, from: me === 'staff' ? 'staff' : 'client', text: t.slice(0, 2000), ts: Date.now() });
    // Cada mensaje nuevo del cliente reinicia la cuenta de 5 minutos sin respuesta.
    if (me === 'client') scheduleDelay();
  }
  catch (e) { console.error('Enviar mensaje:', e); i.value = t; toast('No se pudo enviar el mensaje'); }
}

/* ---------- Inicio ---------- */
(async () => {
  if (!CONFIGURED) { $('#app').innerHTML = '<div class="center"><div class="logo">🔧</div><h1>Falta configurar Firebase</h1><p class="sub">Pega tu firebaseConfig en FIREBASE_CONFIG (dentro del código). Los pasos están al inicio del archivo.</p></div>'; return; }
  try { S = await createFirebase(FIREBASE_CONFIG); }
  catch (e) { document.body.textContent = 'No se pudo iniciar Firebase: ' + e.message; return; }
  showRole();
  const s = await S.session().catch(() => null);
  if (s && s.role === 'staff') enterStaff(s.admin);
  else if (s && s.role === 'client') {
    if (!(await clientAllowed())) { S.signOut().catch(() => {}); showClosed(); return; }
    let f = null;
    try { f = await findContact(s.phone); } catch (e) {}
    f ? enterClient(f.id, f.c) : S.signOut().catch(() => {});
  }
  // Si es anónimo, queda en la pantalla inicial para que ingrese su número.
})();

</script>
